<text x="48.0" y="802.0" font-size="12" fill="#1f2933">A point tower: homes 5.45 m deep in front and behind, 5.7 m beside, round a</text>
<text x="48.0" y="818.0" font-size="12" fill="#1f2933">1.8 m corridor ringing the core;</text>
<text x="48.0" y="834.0" font-size="12" fill="#1f2933">partitions +8% over net areas (declared placeholders). The rules read back</text>
<text x="48.0" y="850.0" font-size="12" fill="#1f2933">from the plates are listed with the figure.</text>
<text x="48.0" y="866.0" font-size="12" fill="#1f2933">The typical floor stands for levels 3 to 7; other floors differ: level 2, 1</text>
<text x="48.0" y="882.0" font-size="12" fill="#1f2933">three-bedroom+, 2 one-bedroom.</text>
<text x="48.0" y="898.0" font-size="12" fill="#1f2933">Stairs drawn with their treads and exit doors; a switchback stair's flights</text>
<text x="48.0" y="914.0" font-size="12" fill="#1f2933">either side of its divider, a scissor stair's two flights crossed; the</text>
<text x="48.0" y="930.0" font-size="12" fill="#1f2933">arrow is the entry from the street.</text>
<text x="48.0" y="946.0" font-size="12" fill="#1f2933">Each home is a block of its area: in a shallow strip it runs long along the</text>
<text x="48.0" y="962.0" font-size="12" fill="#1f2933">facade, where a design would turn the corner.</text>
<text x="48.0" y="978.0" font-size="12" fill="#1f2933">Egress (BC Building Code 2024, Part 3; figures to be verified): dashed, the</text>
<text x="48.0" y="994.0" font-size="12" fill="#1f2933">farthest unit door to its exit along the corridor;</text>
<text x="48.0" y="1010.0" font-size="12" fill="#1f2933">sprinklered (assumed, a placeholder).</text>
<text x="48.0" y="1026.0" font-size="12" fill="#1f2933">The scissor stair: two stairs interlocked in one shaft, its doors on the</text>
<text x="48.0" y="1042.0" font-size="12" fill="#1f2933">core's opposite faces, apart by the way round it; a smoke-tight rated</text>
<text x="48.0" y="1058.0" font-size="12" fill="#1f2933">separation between them.</text>
<text x="48.0" y="1074.0" font-size="12" fill="#1f2933">Rules as of 2026-11-23 · drawn from the option and the massing, not a</text>
<text x="48.0" y="1090.0" font-size="12" fill="#1f2933">design</text>
</svg>