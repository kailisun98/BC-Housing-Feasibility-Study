<text x="48.0" y="725.6" font-size="12" fill="#1f2933">Unit depth 9.15 m either side of a 1.8 m corridor; core bay 7.0 m;</text>
<text x="48.0" y="741.6" font-size="12" fill="#1f2933">partitions +8% over net areas (declared placeholders). The rules read back from</text>
<text x="48.0" y="757.6" font-size="12" fill="#1f2933">the plates are listed with the figure.</text>
<text x="48.0" y="773.6" font-size="12" fill="#1f2933">The typical floor stands for levels 3 to 5; other floors differ: level 2, 2</text>
<text x="48.0" y="789.6" font-size="12" fill="#1f2933">three-bedroom+, 6 two-bedroom, 5 one-bedroom, 1 studio.</text>
