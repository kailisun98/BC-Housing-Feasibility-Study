<text x="48.0" y="802.0" font-size="12" fill="#1f2933">Unit depth 11.94 m either side of a 1.8 m corridor; core bay 7.0 m;</text>
<text x="48.0" y="818.0" font-size="12" fill="#1f2933">partitions +8% over net areas (declared placeholders). The rules read back</text>
<text x="48.0" y="834.0" font-size="12" fill="#1f2933">from the plates are listed with the figure.</text>
<text x="48.0" y="850.0" font-size="12" fill="#1f2933">The typical floor stands for levels 4 to 6; other floors differ: level 2, 2</text>
<text x="48.0" y="866.0" font-size="12" fill="#1f2933">three-bedroom+, 1 one-bedroom; level 3, 2 three-bedroom+, 2 one-bedroom.</text>
<text x="48.0" y="882.0" font-size="12" fill="#1f2933">Stairs drawn with their treads and exit doors; a switchback stair's flights</text>
<text x="48.0" y="898.0" font-size="12" fill="#1f2933">either side of its divider, a scissor stair's two flights crossed; the</text>
<text x="48.0" y="914.0" font-size="12" fill="#1f2933">arrow is the entry from the street.</text>
<text x="48.0" y="930.0" font-size="12" fill="#1f2933">Egress (BC Building Code 2024, Part 3; figures to be verified): dashed, the</text>
<text x="48.0" y="946.0" font-size="12" fill="#1f2933">farthest unit door to its exit along the corridor;</text>
<text x="48.0" y="962.0" font-size="12" fill="#1f2933">sprinklered (assumed, a placeholder); a core 7 m wide read as two 2.2 m</text>
<text x="48.0" y="978.0" font-size="12" fill="#1f2933">stairs at its ends.</text>
<text x="48.0" y="994.0" font-size="12" fill="#1f2933">Rules as of 2026-11-23 · drawn from the option and the massing, not a</text>
<text x="48.0" y="1010.0" font-size="12" fill="#1f2933">design</text>
