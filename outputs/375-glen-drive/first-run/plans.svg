<text x="48.0" y="1132.0" font-size="12" fill="#1f2933">partitions +8% over net areas (declared placeholders). The rules read back</text>
<text x="48.0" y="1148.0" font-size="12" fill="#1f2933">from the plates are listed with the figure.</text>
<text x="48.0" y="1164.0" font-size="12" fill="#1f2933">The typical floor stands for levels 6 to 10; other floors differ: level 2,</text>
<text x="48.0" y="1180.0" font-size="12" fill="#1f2933">3 three-bedroom+, 6 two-bedroom; levels 3 to 4, 10 two-bedroom; level 5, 9</text>
<text x="48.0" y="1196.0" font-size="12" fill="#1f2933">two-bedroom, 1 one-bedroom, 1 studio; level 11, 10 one-bedroom, 6 studio;</text>
<text x="48.0" y="1212.0" font-size="12" fill="#1f2933">level 12, 20 studio; level 13, 4 studio; levels 14 to 15, no homes.</text>
<text x="48.0" y="1228.0" font-size="12" fill="#1f2933">Stairs drawn with their treads and exit doors; a switchback stair's flights</text>
<text x="48.0" y="1244.0" font-size="12" fill="#1f2933">either side of its divider, a scissor stair's two flights crossed; the</text>
<text x="48.0" y="1260.0" font-size="12" fill="#1f2933">arrow is the entry from the street.</text>
<text x="48.0" y="1276.0" font-size="12" fill="#1f2933">Each home is a block of its area: in a shallow strip it runs long along the</text>
<text x="48.0" y="1292.0" font-size="12" fill="#1f2933">facade, where a design would turn the corner.</text>
<text x="48.0" y="1308.0" font-size="12" fill="#1f2933">Egress (BC Building Code 2024, Part 3; figures to be verified): dashed, the</text>
<text x="48.0" y="1324.0" font-size="12" fill="#1f2933">farthest unit door to its exit along the corridor;</text>
<text x="48.0" y="1340.0" font-size="12" fill="#1f2933">sprinklered (assumed, a placeholder).</text>
<text x="48.0" y="1356.0" font-size="12" fill="#1f2933">The scissor stair: two stairs interlocked in one shaft, its doors on the</text>
<text x="48.0" y="1372.0" font-size="12" fill="#1f2933">core's opposite faces, apart by the way round it; a smoke-tight rated</text>
<text x="48.0" y="1388.0" font-size="12" fill="#1f2933">separation between them.</text>
<text x="48.0" y="1404.0" font-size="12" fill="#1f2933">Rules as of 2026-11-17 · drawn from the option and the massing, not a</text>
<text x="48.0" y="1420.0" font-size="12" fill="#1f2933">design</text>
</svg>