<text x="48.0" y="1100.0" font-size="12" fill="#1f2933">Unit depth 12.35 m either side of a 1.8 m corridor; core bay 7.0 m;</text>
<text x="48.0" y="1116.0" font-size="12" fill="#1f2933">partitions +8% over net areas (declared placeholders). The rules read back</text>
<text x="48.0" y="1132.0" font-size="12" fill="#1f2933">from the plates are listed with the figure.</text>
<text x="48.0" y="1148.0" font-size="12" fill="#1f2933">The typical floor stands for levels 2 to 5; other floors differ: level 6, 1</text>
<text x="48.0" y="1164.0" font-size="12" fill="#1f2933">one-bedroom, 2 studio.</text>
<text x="48.0" y="1180.0" font-size="12" fill="#1f2933">Stairs drawn with their treads and exit doors; a switchback stair's flights</text>
<text x="48.0" y="1196.0" font-size="12" fill="#1f2933">either side of its divider, a scissor stair's two flights crossed; the</text>
<text x="48.0" y="1212.0" font-size="12" fill="#1f2933">arrow is the entry from the street.</text>
<text x="48.0" y="1228.0" font-size="12" fill="#1f2933">Egress (BC Building Code 2024, Part 3; figures to be verified): dashed, the</text>
<text x="48.0" y="1244.0" font-size="12" fill="#1f2933">farthest unit door to its exit along the corridor;</text>
<text x="48.0" y="1260.0" font-size="12" fill="#1f2933">sprinklered (assumed, a placeholder); a core 7 m wide read as two 2.2 m</text>
<text x="48.0" y="1276.0" font-size="12" fill="#1f2933">stairs at its ends.</text>
<text x="48.0" y="1292.0" font-size="12" fill="#1f2933">Rules as of 2026-11-23 · drawn from the option and the massing, not a</text>
<text x="48.0" y="1308.0" font-size="12" fill="#1f2933">design</text>
</svg>