<text x="48.0" y="834.0" font-size="12" fill="#1f2933">from the plates are listed with the figure.</text>
<text x="48.0" y="850.0" font-size="12" fill="#1f2933">The typical floor stands for levels 2 to 5, every floor above the ground</text>
<text x="48.0" y="866.0" font-size="12" fill="#1f2933">the same.</text>
