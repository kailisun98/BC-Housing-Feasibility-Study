<text x="180.4" y="1076.1" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2933">N</text>
<text x="48.0" y="1100.0" font-size="12" fill="#1f2933">A point tower: homes 5.2 m deep in front and behind, 4.97 m beside, round a</text>
<text x="48.0" y="1116.0" font-size="12" fill="#1f2933">1.8 m corridor ringing the core;</text>
<text x="48.0" y="1132.0" font-size="12" fill="#1f2933">partitions +8% over net areas (declared placeholders). The rules read back</text>
<text x="48.0" y="1148.0" font-size="12" fill="#1f2933">from the plates are listed with the figure.</text>
<text x="48.0" y="1164.0" font-size="12" fill="#1f2933">The typical floor stands for levels 2 to 7; other floors differ: levels 8</text>
<text x="48.0" y="1180.0" font-size="12" fill="#1f2933">to 10, no homes.</text>
<text x="48.0" y="1196.0" font-size="12" fill="#1f2933">Stairs drawn with their treads and exit doors; a switchback stair's flights</text>
<text x="48.0" y="1212.0" font-size="12" fill="#1f2933">either side of its divider, a scissor stair's two flights crossed; the</text>
<text x="48.0" y="1228.0" font-size="12" fill="#1f2933">arrow is the entry from the street.</text>
<text x="48.0" y="1244.0" font-size="12" fill="#1f2933">Each home is a block of its area: in a shallow strip it runs long along the</text>
<text x="48.0" y="1260.0" font-size="12" fill="#1f2933">facade, where a design would turn the corner.</text>
<text x="48.0" y="1276.0" font-size="12" fill="#1f2933">Egress (BC Building Code 2024, Part 3; figures to be verified): dashed, the</text>
<text x="48.0" y="1292.0" font-size="12" fill="#1f2933">farthest unit door to its exit along the corridor;</text>
<text x="48.0" y="1308.0" font-size="12" fill="#1f2933">sprinklered (assumed, a placeholder).</text>
<text x="48.0" y="1324.0" font-size="12" fill="#1f2933">The scissor stair: two stairs interlocked in one shaft, its doors on the</text>
<text x="48.0" y="1340.0" font-size="12" fill="#1f2933">core's opposite faces, apart by the way round it; a smoke-tight rated</text>
<text x="48.0" y="1356.0" font-size="12" fill="#1f2933">separation between them.</text>
<text x="48.0" y="1372.0" font-size="12" fill="#1f2933">Rules as of 2026-11-23 · drawn from the option and the massing, not a</text>
<text x="48.0" y="1388.0" font-size="12" fill="#1f2933">design</text>
</svg>